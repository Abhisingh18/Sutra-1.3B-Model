<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2549c7; }
    a:hover { color: #ff7a1a; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; background: #fbfbfa; color: #10131c; font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 76px; box-sizing: border-box; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
    <span style="width: 62px; height: 62px; border-radius: 17px; background: linear-gradient(140deg, {{accent}}, {{indigo}}); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 600;">स</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 0.14em; color: #6b7280;">1 / 5</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 34px;">
    <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 26px; letter-spacing: 0.1em; text-transform: uppercase; color: {{accent}};">Eleven days, four GPUs</p>
    <h1 style="margin: 0; font-size: 108px; line-height: 0.94; font-weight: 800; letter-spacing: -0.045em;">I trained a language model from scratch.</h1>
    <p style="margin: 0; font-size: 38px; line-height: 1.35; color: #3c4353; max-width: 22ch;">No pretrained weights. No fine-tuning someone else&#39;s model. Every weight learned from zero.</p>
  </div>

  <div style="display: flex; gap: 20px; align-items: stretch;">
    <div style="width: 6px; background: linear-gradient(180deg, {{accent}}, {{indigo}}); border-radius: 3px;"></div>
    <div style="display: flex; flex-direction: column; gap: 6px; font-family: 'JetBrains Mono', monospace;">
      <span style="font-size: 44px; font-weight: 700; letter-spacing: -0.02em;">Sutra-1.3B</span>
      <span style="font-size: 24px; color: #6b7280;">Mixture of Experts &middot; 18B tokens &middot; built in PyTorch</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#ff7a1a","options":["#ff7a1a","#e8611a","#c2410c","#d97706"]},"indigo":{"editor":"color","default":"#2549c7","options":["#2549c7","#1a327f","#3730a3","#1d4ed8"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#ff7a1a',
      indigo: this.props.indigo ?? '#2549c7'
    };
  }
}
</script>
</body>
</html>
